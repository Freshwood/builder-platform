repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: "\\.svg$|__snapshots__"
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: lint-imports
        name: import-linter (architecture contracts)
        entry: uv run lint-imports
        language: system
        types: [python]
        pass_filenames: false
      - id: prompt-lock
        name: prompt lock (versioned prompt changes, docs/ai/README.md)
        entry: uv run pytest -q apps/api/tests/test_prompt_lock.py
        language: system
        files: ^(apps/api/src/homeworking/modules/agent/|packages/construction-model/src/construction_model/assembly\.py|docs/ai/PROMPT_CHANGELOG\.md)
        pass_filenames: false
