# Homeworking task runner (https://taskfile.dev). Run `task` to list tasks.
version: "3"

dotenv: [".env"]

# Prefix every line with the task name so parallel output (dev, check) stays readable.
output: prefixed

vars:
  PG_URL: postgresql+psycopg://homeworking:homeworking@localhost:5433/homeworking
  PNPM: corepack pnpm
  # Change in .env when port 8000 is taken by another app (keep API_ORIGIN in sync).
  API_PORT: '{{.API_PORT | default "8000"}}'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # --- Setup ---------------------------------------------------------------------------------

  setup:
    desc: First-time setup (.env from template, all dependencies)
    cmds:
      - cmd: cp -n .env.example .env || true
        platforms: [linux, darwin]
      - task: install

  install:
    desc: Install all dependencies (skipped when lockfiles are unchanged)
    deps: [install:py, install:web]

  install:py:
    run: once
    desc: Install Python dependencies with uv
    sources: [uv.lock, pyproject.toml, apps/api/pyproject.toml]
    generates: ['{{.UV_PROJECT_ENVIRONMENT | default ".venv"}}/pyvenv.cfg']
    cmds:
      - uv sync --locked

  install:web:
    run: once
    desc: Install Node dependencies with pnpm
    sources: [pnpm-lock.yaml, package.json, apps/web/package.json]
    generates: [node_modules/.modules.yaml]
    cmds:
      - "{{.PNPM}} install --frozen-lockfile"

  # --- Infrastructure ------------------------------------------------------------------------

  infra:
    desc: Start local infrastructure (PostgreSQL)
    cmds:
      - docker compose up -d --wait postgres

  infra:down:
    desc: Stop local infrastructure (data volumes are kept)
    cmds:
      - docker compose down

  migrate:
    desc: Apply database migrations
    deps: [install:py, infra]
    cmds:
      - uv run --package homeworking-api alembic -c apps/api/alembic.ini upgrade head

  # --- Development ---------------------------------------------------------------------------

  dev:
    desc: Run API (:8000, see API_PORT) and web app (:3000) in development mode
    deps: [install:web, migrate]
    cmds:
      - task: dev:servers

  dev:servers:
    internal: true
    deps: [dev:api, dev:web, dev:warmup]

  dev:warmup:
    internal: true
    # next dev compiles each route on first request (minutes on /mnt/c); do it before the user.
    cmds:
      - node apps/web/scripts/warmup.mjs

  dev:api:
    desc: Run only the API with auto-reload
    cmds:
      # Watch only the source trees; the default (whole repo incl. .venv, node_modules) is slow.
      - >-
        uv run uvicorn homeworking.main:app --reload --port {{.API_PORT}}
        --reload-dir apps/api/src

  dev:web:
    desc: Run only the web app
    cmds:
      - "{{.PNPM}} --filter web dev"

  start:
    desc: Run API and web app like in production (prebuilt pages, no compiling on first visit)
    deps: [install:web, migrate]
    cmds:
      - "{{.PNPM}} --filter web build"
      - task: start:servers

  start:servers:
    internal: true
    deps: [start:api, start:web]

  start:api:
    internal: true
    cmds:
      - uv run uvicorn homeworking.main:app --port {{.API_PORT}}

  start:web:
    internal: true
    cmds:
      - "{{.PNPM}} --filter web start"

  # --- Quality -------------------------------------------------------------------------------

  check:
    desc: Lint, format check, type check, architecture contracts (Python and web in parallel)
    deps: [check:py, check:web]

  check:py:
    desc: ruff, mypy (strict), import-linter
    deps: [install:py]
    cmds:
      - uv run ruff format --check .
      - uv run ruff check .
      - uv run mypy
      - uv run lint-imports

  check:web:
    desc: eslint, tsc and the Vitest unit tests of the web app
    deps: [install:web]
    cmds:
      - "{{.PNPM}} -r lint"
      - "{{.PNPM}} -r typecheck"
      - "{{.PNPM}} -r test"

  fmt:
    desc: Format and auto-fix Python and web code
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .
      - "{{.PNPM}} -r format"

  test:
    desc: "Python tests (SQLite). Extra pytest args: task test -- -k undo"
    deps: [install:py]
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  test:web:
    desc: "Vitest unit tests of the web app (src/lib). Watch mode: pnpm --filter web test:watch"
    deps: [install:web]
    cmds:
      - "{{.PNPM}} --filter web test {{.CLI_ARGS}}"

  test:pg:
    desc: Python tests including PostgreSQL integration tests
    deps: [install:py, infra]
    env:
      TEST_DATABASE_URL: "{{.PG_URL}}"
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  bench:
    desc: "Offline token benchmark of the agent (no API calls). Label: task bench -- --label phase1"
    deps: [install:py]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    cmds:
      - uv run python -m homeworking_dev.bench {{.CLI_ARGS}}

  prompt:lock:
    desc: Record the prompt fingerprint after a prompt/tool change (needs a new PROMPT_VERSION)
    deps: [install:py]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    cmds:
      - uv run python -m homeworking.modules.agent.provenance
      - uv run python -m homeworking.modules.pipeline.provenance

  regress:
    desc: Replay the regression cases and run the intent/corpus checks (offline)
    deps: [install:py]
    cmds:
      - >-
        uv run pytest apps/api/tests/test_regressions.py
        apps/api/tests/calc_engine/test_corpus.py
        apps/api/tests/calc_engine/test_corpus_views.py
        apps/api/tests/calc_engine/test_intent.py {{.CLI_ARGS}}

  regress:capture:
    desc: "Draft a regression case from a failed agent run: task regress:capture -- <run_id>"
    deps: [install:py]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    cmds:
      - uv run python -m homeworking_dev.capture {{.CLI_ARGS}}

  regress:promote:
    desc: "Check a finished draft and make it a case: task regress:promote -- <slug>"
    deps: [install:py]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    cmds:
      - uv run python -m homeworking_dev.capture promote {{.CLI_ARGS}}

  eval:live:
    desc: Live LLM evaluation of the regression briefs (needs LLM_MODE=openai and a key; costs money; not part of CI)
    deps: [install:py]
    env:
      PYDANTIC_AI_NO_BANNER: "1"
    cmds:
      - uv run python -m homeworking_dev.live_eval {{.CLI_ARGS}}

  pipeline:live:
    desc: One brief through the pipeline stages with the real models, tokens and errors per stage (costs money; not part of CI)
    deps: [install:py]
    cmds:
      - uv run python -m homeworking_dev.pipeline_live {{.CLI_ARGS}}

  e2e:
    desc: "Browser tests: end-to-end specs and Gherkin scenarios with accessibility checks (offline LLM)"
    deps: [install:py, install:web]
    cmds:
      - mkdir -p var
      # Throwaway database: create_all does not add columns to an existing file (migrations do).
      - rm -f var/e2e.db
      - "{{.PNPM}} --filter web e2e {{.CLI_ARGS}}"

  e2e:install:
    desc: Install the Playwright browser (once)
    cmds:
      - "{{.PNPM}} --filter web exec playwright install --with-deps chromium --only-shell"

  bdd:
    desc: "All Gherkin scenarios: API (pytest-bdd) and browser (playwright-bdd)"
    cmds:
      - task: bdd:backend
      - task: bdd:frontend

  bdd:backend:
    desc: "Gherkin scenarios against the API, in-process (offline LLM). Filter: task bdd:backend -- -k Regal"
    deps: [install:py]
    cmds:
      - uv run pytest apps/api/tests/bdd {{.CLI_ARGS}}

  bdd:frontend:
    desc: "Gherkin scenarios in the browser (offline LLM). Filter: task bdd:frontend -- --grep Regal"
    deps: [install:py, install:web]
    cmds:
      - mkdir -p var
      - rm -f var/e2e.db
      - "{{.PNPM}} --filter web test:bdd {{.CLI_ARGS}}"

  # --- API client ----------------------------------------------------------------------------

  openapi:
    desc: Export OpenAPI schema and regenerate the TypeScript client (only when the API changed)
    deps: [install:py, install:web]
    sources: ["apps/api/src/**/*.py", apps/web/openapi-ts.config.ts]
    generates: [apps/web/openapi.json, "apps/web/src/api/gen/**/*.ts"]
    cmds:
      - uv run python -m homeworking.openapi > apps/web/openapi.json
      - "{{.PNPM}} --filter web generate"

  openapi:check:
    desc: Fail if the committed OpenAPI schema is out of date (as in CI)
    cmds:
      - uv run python -m homeworking.openapi | diff -u apps/web/openapi.json -

  # --- Aggregates ----------------------------------------------------------------------------

  ci:
    desc: Run what CI runs (checks, tests, schema drift) before pushing
    cmds:
      - task: check
      - task: test
      - task: openapi:check

  clean:
    desc: Remove caches and build output (keeps .venv and node_modules)
    cmds:
      - rm -rf apps/web/tests/bdd/.features-gen var/bdd.db .mypy_cache .ruff_cache .pytest_cache .import_linter_cache .hypothesis .task apps/web/.next apps/web/test-results var/e2e.db
