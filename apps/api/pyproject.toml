[project]
name = "homeworking-api"
version = "0.1.0"
description = "Homeworking platform API (modular monolith)"
requires-python = ">=3.13"
dependencies = [
    "construction-model",
    "calc-engine",
    "fastapi>=0.141,<0.143",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.12,<2.14",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.40,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-ai-slim[openai]>=2.49,<2.50",
    "weasyprint>=66,<71",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "httpx>=0.28",
]

[tool.uv.sources]
construction-model = { workspace = true }
calc-engine = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homeworking"]
