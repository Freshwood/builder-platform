[project]
name = "homeworking-workspace"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv]
package = false
# Supply-chain cooldown: ignore releases younger than a week.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
homeworking-api = { workspace = true }

[dependency-groups]
dev = [
    "homeworking-api",
    "ruff>=0.15,<0.17",
    "mypy>=1.18,<2.4",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2",
    "hypothesis>=6.140",
    "syrupy>=5.0",
    "import-linter>=2.5",
    "aiosqlite>=0.21",
    "pre-commit>=4.3",
    "pytest-bdd>=9.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "N"]
# E501: the formatter wraps code; long German UI strings are fine.
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "homeworking",
    "homeworking_dev",
    "corpus",
    "corpus_designs",
    "design_fixtures",
    "api_designs",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "N802"]
"apps/api/src/homeworking/migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["apps/api/src", "apps/api/devtools"]

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps/api/tests"]
addopts = "--import-mode=importlib"
# Shared test helpers (corpus, design fixtures); importlib mode adds no directory to sys.path itself.
pythonpath = ["apps/api/tests/support"]
markers = ["postgres: requires a running PostgreSQL (docker compose)"]

[tool.importlinter]
root_packages = ["homeworking", "homeworking_dev"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain model is independent of engine and platform"
type = "forbidden"
source_modules = ["homeworking.construction_model"]
forbidden_modules = [
    "homeworking.calc_engine",
    "homeworking.api",
    "homeworking.modules",
    "homeworking.db",
    "fastapi",
    "sqlalchemy",
    "pydantic_ai",
]

[[tool.importlinter.contracts]]
name = "Engine is pure (no platform, DB or LLM)"
type = "forbidden"
source_modules = ["homeworking.calc_engine"]
forbidden_modules = [
    "homeworking.api",
    "homeworking.modules",
    "homeworking.db",
    "fastapi",
    "sqlalchemy",
    "pydantic_ai",
]

[[tool.importlinter.contracts]]
name = "Only the API layer may use the agent and pipeline modules"
type = "forbidden"
source_modules = [
    "homeworking.modules.projects",
    "homeworking.modules.documents",
    "homeworking.modules.drawings",
    "homeworking.modules.compliance",
    "homeworking.modules.identity",
]
forbidden_modules = ["homeworking.modules.agent", "homeworking.modules.pipeline"]

[[tool.importlinter.contracts]]
name = "The pipeline does not depend on the chat agent"
type = "forbidden"
source_modules = ["homeworking.modules.pipeline"]
forbidden_modules = ["homeworking.modules.agent"]

[[tool.importlinter.contracts]]
name = "The shared LLM package depends on neither the agent nor the pipeline"
type = "forbidden"
source_modules = ["homeworking.modules.llm"]
forbidden_modules = ["homeworking.modules.agent", "homeworking.modules.pipeline"]

[[tool.importlinter.contracts]]
name = "Modules do not import the API layer or the composition root"
type = "forbidden"
source_modules = ["homeworking.modules"]
forbidden_modules = ["homeworking.api", "homeworking.bootstrap", "homeworking.main"]

[[tool.importlinter.contracts]]
name = "The runtime package does not import developer tooling"
type = "forbidden"
source_modules = ["homeworking"]
forbidden_modules = ["homeworking_dev"]
