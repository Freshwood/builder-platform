[project]
name = "construction-model"
version = "0.1.0"
description = "Homeworking construction project model (pure domain, no I/O)"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12,<2.14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/construction_model"]
